# F-Droid 収録メタデータ (fdroiddata へ提出する雛形)。
#
# 提出先: https://gitlab.com/fdroid/fdroiddata の metadata/io.github.tmlksu.uchidenlink.yml
# 手元で検証する場合:
#   git clone https://gitlab.com/fdroid/fdroiddata && cd fdroiddata
#   cp <this file> metadata/io.github.tmlksu.uchidenlink.yml
#   fdroid lint io.github.tmlksu.uchidenlink
#   fdroid build -v -l io.github.tmlksu.uchidenlink     # Docker/VM が要る

Categories:
  - Phone & SMS
  - Internet
License: Apache-2.0
AuthorName: tmlksu
SourceCode: https://github.com/tmlksu/uchidenlink
IssueTracker: https://github.com/tmlksu/uchidenlink/issues

AutoName: ウチ電Link

RepoType: git
Repo: https://github.com/tmlksu/uchidenlink.git

Builds:
  - versionName: '1.7.0'
    versionCode: 12
    commit: v1.7.0
    subdir: android/app
    gradle:
      - foss

# 収録後のバージョン追従: git タグ (v1.7.0, ...) を見る。
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: '1.7.0'
CurrentVersionCode: 12

# --- レビューで聞かれそうな点のメモ (提出時は削って構わない) ---
#
# 1. 依存はすべて Apache-2.0。foss フレーバーの実行時依存に
#    Firebase / Google Play services は一切入らない (検証済み)。
#    build.gradle には gmsImplementation で firebase-messaging の記述があるが、
#    これは gms フレーバー専用で foss のビルドには含まれない。
#    scanner がこの記述を拾って警告する場合は、この build に
#    `scanignore: android/app/build.gradle` を足すか、
#    フレーバー限定であることを説明する。
#
# 2. AntiFeatures は付かないと考えている。relay (このアプリの接続先) は
#    同じリポジトリの Apache-2.0 な Go プログラムで、利用者が自分で動かす。
#    特定事業者のサービスに依存しない (Cloudflare Tunnel は推奨構成の一例で、
#    必須ではない。relay は AUTH_MODE=token で単独でも動く)。
#
# 3. push 通知は foss フレーバーには無い。常駐 (フォアグラウンドサービス) で
#    WebSocket を張り続ける運用が前提。full_description に明記済み。
